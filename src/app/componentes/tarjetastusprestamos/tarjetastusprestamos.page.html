
<div class="tarjeta-intercambio">

  <div class="prendas-intercambio">

    <div class="prenda-intercambio">
      <img
        [src]="intercambio.imagenEntregada"
        alt="Prenda entregada"
      >
      <p>Fecha inicio: {{ intercambio.fechaInicio }}</p>
    </div>

    <ion-icon
      name="swap-horizontal-outline"
      class="icono-intercambio">
    </ion-icon>

    <div class="prenda-intercambio">
      <img
        [src]="intercambio.imagenRecibida"
        alt="Prenda recibida"
      >
      <p>Fecha fin: {{ intercambio.fechaFin }}</p>
    </div>

  </div>

  <div class="recordatorio">
    <ion-icon name="mail-unread-outline"></ion-icon>
    <span>Añadir recordatorio</span>
  </div>

</div>
