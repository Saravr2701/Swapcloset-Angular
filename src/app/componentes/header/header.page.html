
<ion-header [translucent]="false">
  <ion-toolbar>

    <div class="cabecera">
      <h1>SwapCloset</h1>
      <div class="saldo">0.00€</div>
    </div>

    <div class="busqueda">

      <div class="search-box">
        <ion-icon name="search-outline"></ion-icon>
        <input type="text" placeholder="Buscar" />
      </div>

      <button
        type="button"
        class="filter-btn"
        (click)="mostrarFiltros = !mostrarFiltros"
        [attr.aria-expanded]="mostrarFiltros"
        aria-controls="panel-filtros"
        aria-label="Mostrar u ocultar filtros">

        <ion-icon name="options-outline"></ion-icon>

      </button>

    </div>

    @if (mostrarFiltros) {

      <div class="panel-filtros" id="panel-filtros">

        <p>Filtrar por:</p>

        <div class="opciones-filtros">

          <div class="columna-filtros">

            <label>
              <input type="checkbox">
              Ubicación
            </label>

            <label>
              <input type="checkbox">
              Talla
            </label>

            <label>
              <input type="checkbox">
              Color
            </label>

          </div>

          <div class="columna-filtros">

            <label>
              <input type="checkbox">
              Tipo de oferta
            </label>

            <label>
              <input type="checkbox">
              <span>↑ Fecha de publicación</span>
            </label>

            <label>
              <input type="checkbox">
              <span>↓ Fecha de publicación</span>
            </label>

          </div>

        </div>

      </div>

    }

    <div class="categorias">

      @for (categoria of categorias; track categoria.ruta) {

        <a
          [routerLink]="categoria.ruta"
          routerLinkActive="activa"
          [routerLinkActiveOptions]="{ exact: true }"
          class="categoria">

          {{ categoria.nombre }}

        </a>

      }

    </div>

  </ion-toolbar>
</ion-header>
