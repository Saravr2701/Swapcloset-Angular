<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="iniciotodo">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="anadirprendas">
      <ion-icon name="duplicate-outline"></ion-icon>
      <ion-label>Añadir Prenda</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="chats">
      <ion-icon name="chatbubbles-outline"></ion-icon>
      <ion-label>Chats</ion-label>
    </ion-tab-button>

    <ion-tab-button
      tab="perfil"
      [class.boton-atras]="router.url.startsWith('/tabs/ajustes') ||
                       router.url.startsWith('/tabs/recordatorios')">

      <ion-icon
        [name]="router.url.startsWith('/tabs/ajustes') ||
            router.url.startsWith('/tabs/recordatorios')
            ? 'arrow-back-outline'
            : 'person-outline'">
      </ion-icon>

      <ion-label>
        {{
          router.url.startsWith('/tabs/ajustes') ||
          router.url.startsWith('/tabs/recordatorios')
            ? 'Atrás'
            : 'Perfil'
        }}
      </ion-label>

    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
