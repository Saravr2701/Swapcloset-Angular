<!-- Toda la tarjeta funciona como un enlace -->
<a
  class="tarjeta-chat"
  [routerLink]="['/tabs/conversacion', chat.id]">

  <!-- Fotografía de la persona -->
  <img
    [src]="chat.imagen"
    [alt]="chat.nombre"
    class="foto-chat">

  <div class="informacion-chat">

    <div class="fila-nombre">

      <!-- Nombre de la persona -->
      <h3>{{ chat.nombre }} | {{chat.prendaSolicitada}}</h3>

      <!-- Punto azul si hay mensajes sin leer -->
      @if (chat.sinLeer) {
        <span class="punto-azul"></span>
      }

    </div>

    <!-- Mostramos el último mensaje -->
    <p [class.mensaje-no-leido]="chat.sinLeer">
      {{ chat.mensajes[chat.mensajes.length - 1].texto }}
    </p>

  </div>

</a>
