<div class="tarjeta-prenda">
  <div class="foto">
    <img [src]="prenda().imagen" [alt]="prenda().titulo" />
    <span class="badge-intercambio">{{ prenda().etiqueta || 'Intercambio' }}</span>
  </div>

  <div class="info">
    <h3 class="titulo">{{ prenda().titulo }}</h3>
    <p class="subtitulo">{{ prenda().subtitulo }}</p>
  </div>
</div>
