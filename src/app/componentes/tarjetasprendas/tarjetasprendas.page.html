<!-- Creamos la tarjeta con a porque al fin y al cabo es un enlace
      que nos llevará a otra pantalla, routerlink nos redirige a la nueva
      página y -->
<a class="tarjeta-prenda" [routerLink]="['/tabs/detalleprenda', prenda().id]">

  <!-- Con este contenido de a mostramos la informacioón de la tarjeta del inicio
        (las tarjetas del menú de iniciotodo, inicioaccesorio, etc) -->

  <div class="foto">
    <img [src]="prenda().imagen" [alt]="prenda().titulo">
    <!-- mostramos la etiqueta de si es intercambio o préstamo obteniendola de la prenda -->
    <span class="intercambio">
      {{ prenda().etiqueta }}
    </span>
  </div>

  <div class="info">
    <h3 class="titulo">
      {{ prenda().titulo }}
    </h3>

    <p class="subtitulo">
      {{ prenda().subtitulo }}
    </p>
  </div>
</a>
