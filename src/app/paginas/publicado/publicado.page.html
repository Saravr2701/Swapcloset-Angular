<ion-content [fullscreen]="true" class="contenido-publicado">

  <div class="confirmacion">

    <h1>Anuncio publicado</h1>

    <p>
      Tu prenda ya es visible para el resto de usuarios
    </p>

    <div class="botones-publicado">

      <button
        type="button"
        routerLink="/tabs/anadirprendas">
        Publicar otro anuncio
      </button>

      <button
        type="button"
        routerLink="/tabs/iniciotodo">
        Volver a inicio
      </button>

    </div>
  </div>

</ion-content>
