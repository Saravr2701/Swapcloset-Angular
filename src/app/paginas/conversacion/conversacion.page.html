<ion-content [fullscreen]="true" class="ion-padding">
  <!-- Recorremos la conversación encontrada -->
  @for (chat of conversacion; track chat.id) {

    <div class="datos-chat">
      <img [src]="chat.prenda" [alt]="chat.prendaSolicitada" class="foto-prenda">
      <div class="informacion-prenda">
        <h4>{{ chat.nombre }}</h4>
        <p>{{ chat.prendaSolicitada }}</p>
      </div>

    </div>
    <div class="mensajes">
      @for (mensaje of chat.mensajes; track $index) {
        <div class="mensaje" [class.mio]="mensaje.mio">
          {{ mensaje.texto }}
        </div>
      }
    </div>
  } @empty {
    <p>No se ha encontrado la conversación.</p>
  }
</ion-content>

<ion-footer class="barra-mensajes">
  <ion-toolbar>
    <div class="escribir-mensaje">
      <div class="campo-mensaje">
        <ion-icon name="happy-outline"></ion-icon>

        <input type="text" placeholder="Escribe un mensaje...">

        <ion-icon name="attach-outline"></ion-icon>

        <ion-icon name="camera-outline"></ion-icon>
      </div>

      <button class="boton-microfono" type="button">
        <ion-icon name="mic-outline"></ion-icon>
      </button>

      <button class="boton-enviar" type="button">
        <ion-icon name="send-outline"></ion-icon>
      </button>
    </div>
  </ion-toolbar>
</ion-footer>
