<ion-header [translucent]="false" class="cabecera-mensajes">
  <ion-toolbar>
    <div class="cabecera">
      <h1>Mensajes</h1>
    </div>

    <div class="busqueda">
      <div class="search-box">
        <input type="text" placeholder="Buscar una conversación" />
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="contenido-chats">
  <div class="lista-chats">
    @for (chat of chats; track chat.id) {
      <app-tarjetaschats [chat]="chat" />
    }
  </div>
</ion-content>
